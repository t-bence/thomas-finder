command:
  - python
  - -m
  - streamlit
  - run
  - app.py
  - --server.port
  - "8080"
  - --server.headless
  - "true"

env:
  - name: CATALOG
    value: "workspace"
  - name: SCHEMA
    value: "thomas"
  - name: VS_ENDPOINT
    value: "thomas-finder-vs"
  - name: VS_INDEX
    value: "workspace.thomas.episode_chunks_index"
